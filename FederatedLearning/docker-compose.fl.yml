      FL_LOCAL_EPOCHS: "2"
      FL_LEARNING_RATE: "0.01"
      FL_RUN_ONCE: "false"
      FL_RECONNECT_DELAY_SECONDS: "5"
      FL_MIN_LABELED_SAMPLES: "${FL_MIN_LABELED_SAMPLES:-6}"
