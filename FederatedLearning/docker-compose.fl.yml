      FL_PREPROCESSING_MEAN: "[0.485, 0.456, 0.406]"
      FL_PREPROCESSING_STD: "[0.229, 0.224, 0.225]"
      PYTHONUNBUFFERED: "1"
      FL_AUGMENT: "${FL_AUGMENT:-true}"
