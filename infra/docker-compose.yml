name: sitim

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitim-postgres
    environment:
      POSTGRES_DB: sitim
      POSTGRES_USER: sitim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitim -d sitim"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: sitim-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # Multi-Orthanc architecture: separate PACS instance per institution
  orthanc-mci:
    image: orthancteam/orthanc:25.12.3
    container_name: sitim-orthanc-mci
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      VERBOSE_STARTUP: "true"
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc_mci_db:/var/lib/orthanc/db
      - ./orthanc/orthanc-mci.json:/etc/orthanc/orthanc.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  orthanc-mikof:
    image: orthancteam/orthanc:25.12.3
    container_name: sitim-orthanc-mikof
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      VERBOSE_STARTUP: "true"
    ports:
      - "8043:8042"
      - "4243:4242"
    volumes:
      - orthanc_mikof_db:/var/lib/orthanc/db
      - ./orthanc/orthanc-mikof.json:/etc/orthanc/orthanc.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  orthanc-ovisus:
    image: orthancteam/orthanc:25.12.3
    container_name: sitim-orthanc-ovisus
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      VERBOSE_STARTUP: "true"
    ports:
      - "8044:8042"
      - "4244:4242"
    volumes:
      - orthanc_ovisus_db:/var/lib/orthanc/db
      - ./orthanc/orthanc-ovisus.json:/etc/orthanc/orthanc.json:ro
    depends_on:
      postgres:
        condition: service_healthy


  ohif:
    image: orthancteam/ohif-v3:latest
    container_name: sitim-ohif
    volumes:
      # OHIF image serves under /ohif/ (PUBLIC_URL=/ohif/) and loads app-config.js
      # from that subdir, so the SITIM data-source config must live there too.
      - ./ohif/app-config.js:/usr/share/nginx/html/ohif/app-config.js:ro
    depends_on:
      - orthanc-mci
      - orthanc-mikof
      - orthanc-ovisus

  gateway:
    image: nginx:1.27-alpine
    container_name: sitim-gateway
    ports:
      - "3000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ohif
      - orthanc-mci
      - orthanc-mikof
      - orthanc-ovisus

  # MinIO Object Storage for AI models
  minio:
    image: minio/minio:latest
    container_name: sitim-minio
    environment:
      MINIO_ROOT_USER: sitim
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env (see .env.example)}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Client (mc) for initial bucket setup
  minio-setup:
    image: minio/mc:latest
    container_name: sitim-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set sitim-minio http://minio:9000 sitim ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env};
      mc mb --ignore-existing sitim-minio/ai-models;
      mc policy set download sitim-minio/ai-models;
      echo 'MinIO bucket ai-models created successfully';
      "

volumes:
  pgdata:
  orthanc_mci_db:
  orthanc_mikof_db:
  orthanc_ovisus_db:
  minio_data:
