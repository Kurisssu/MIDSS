server {
  listen 80;

  client_max_body_size 2048m;

  location = /ohif {
    return 301 /ohif/;
  }

  location /ohif/ {
    # No trailing slash on proxy_pass: preserve the /ohif/ URI prefix. The OHIF
    # image serves the app under /usr/share/nginx/html/ohif/ (PUBLIC_URL=/ohif/),
    # so stripping the prefix makes asset requests fall back to index.html — HTML
    # served where JS is expected, and the viewer never boots.
    proxy_pass http://ohif:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Legacy Orthanc UI endpoints (for manual access/debugging)
  # MCI institution
  location /orthanc-mci/ {
    proxy_pass http://orthanc-mci:8042/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Mikof institution
  location /orthanc-mikof/ {
    proxy_pass http://orthanc-mikof:8042/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Ovisus institution
  location /orthanc-ovisus/ {
    proxy_pass http://orthanc-ovisus:8042/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Secure DICOMweb route for OHIF:
  # all DICOMweb requests go through SITIM API (token validation + tenant restrictions).
  location /sitim-dicomweb/ {
    # Use API HTTPS endpoint directly to avoid Kestrel's HTTP->HTTPS 307 redirects.
    proxy_pass https://host.docker.internal:7006/api/dicomweb/;
    # Dev-only: API uses local self-signed certificate.
    proxy_ssl_verify off;
    # Forward all headers including X-Viewer-Token
    proxy_pass_request_headers on;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
